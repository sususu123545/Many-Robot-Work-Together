[Unit]
# Pull the sidecars in whenever the core starts.
#
# Why this file exists: PartOf= alone is a ONE-WAY dependency for stop/restart.
# Measured 2026-11-07: `systemctl stop armpi-ros2` then `start` left both
# sidecars dead -- no arm_base in TF and no camera on :8099 -- while every
# status check that only looked at armpi-ros2 said "active".  A drop-in is used
# rather than editing the vendor unit so an image/unit upgrade does not silently
# drop the line.
Wants=armpi-tf-publisher.service armpi-frame-relay.service
