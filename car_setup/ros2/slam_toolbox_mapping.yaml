# ROS 2 (Jazzy) slam_toolbox parameters for the ArmPi Pro, MAPPING pass.
#
# Derived from /opt/ros/jazzy/share/slam_toolbox/config/mapper_params_online_async.yaml
# (slam_toolbox 2.8.5, verified present in the core container on 2026-11-07).
# Differences from the stock template are all measured on this car:
#
#   base_frame  : base_footprint -> base_link  (mecanum_odom publishes odom->base_link)
#   scan_topic  : /scan, whose header.frame_id is base_laser (verified), and
#                 base_link->base_laser is a latched static TF (verified in the
#                 container with ros2 topic echo /tf_static -- it is NOT empty)
#   max_laser_range : 20 -> 8 m.  The LD06 advertises 25 m, but the work area is
#                 a few metres; clipping cuts reflective-floor noise.
#   minimum_travel_distance/heading : 0.5 m / 0.5 rad -> 0.10 m / 0.20 rad.
#                 The stock values are sized for a full-size robot; this car
#                 moves in 25 mm steps and would otherwise never add a scan.
#   check_min_dist_and_heading_precisely : false -> TRUE.  This one is not a
#                 tuning preference, it is a correctness fix.  See
#                 SlamToolbox::shouldProcessScan() in slam_toolbox_common.cpp:
#
#                   if (check_min_dist_and_heading_precisely_) {
#                     if (dist2 < min_dist2 && heading_diff < min_rotation)
#                       return false;              // both small -> reject
#                   } else if (dist2 < 0.8 * min_dist2) {
#                     return false;                // ONLY distance is checked
#                   }
#
#                 With the stock `false`, a pure in-place rotation has
#                 dist2 == 0 and is rejected forever, so the map freezes after
#                 the very first scan.  Verified on this car 2026-11-07: a full
#                 360.1 deg spin produced ZERO new map cells (free stayed 2114,
#                 occupied 119 across 55 consecutive /map messages), while the
#                 same binary with minimum_travel_distance:=0 grew the map with
#                 the car standing still.  Rotation-only surveying is the whole
#                 point on this chassis, so the precise check must be on.
#   map_update_interval : 5 -> 2 s, for a usable /map while walking.
#
# The old car_setup/ld06_slam_toolbox.launch is ROS 1 XML and CANNOT be used.
# Use car_setup/ros2/slam_toolbox.launch.py with this file.
/**:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    min_laser_range: 0.15
    max_laser_range: 8.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    use_scan_matching: true
    use_scan_barycenter: true
    use_scan_best_pose: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.20
    check_min_dist_and_heading_precisely: true

    scan_buffer_size: 5
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
