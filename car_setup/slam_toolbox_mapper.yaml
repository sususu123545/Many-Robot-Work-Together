# slam_toolbox 建图参数 — ArmPi Pro (LD06 雷达 + 麦轮里程计)  ★ROS1 Noetic 版★
# 场景: 室内过道, 两侧桌椅; 车静止时不写图(靠 minimum_travel_* 门槛)
# TF 链保持与 hector 一致: map -> odom -> base_link -> base_laser
#
# ⚠️ ROS1 与 ROS2 的参数文件格式不同!
#    ROS2 写法:  slam_toolbox: / ros__parameters: / <参数>
#    ROS1 写法:  直接顶层写 <参数>  (本文件采用)
#    写错会把参数塞到 /slam_toolbox/slam_toolbox/ros__parameters/ 下,
#    节点根本读不到, 全部回退默认值 (症状: max_laser_range 报 25.0 而非 12.0)

# ---- 求解器 (位姿图优化, 这是相对 hector 的核心升级) ----
solver_plugin: solver_plugins::CeresSolver
ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
ceres_preconditioner: SCHUR_JACOBI
ceres_trust_strategy: LEVENBERG_MARQUARDT
ceres_dogleg_type: TRADITIONAL_DOGLEG
ceres_loss_function: None

# ---- 坐标系 / 话题 (与 hector 配置对齐) ----
odom_frame: odom
map_frame: map
base_frame: base_link
scan_topic: /scan
mode: mapping            # mapping = 建图; localization = 用已存图定位

debug_logging: false
throttle_scans: 1
transform_publish_period: 0.02   # 50Hz 发 map->odom
map_update_interval: 2.0         # 每 2s 出一版 /map
resolution: 0.05                 # 与 hector 一致
max_laser_range: 10.0            # ⭐ 09-19 由 8.0 提到 10.0: 空旷区墙都 >8m 全被丢弃
                                 #    → 扫描匹配无特征 → 位姿冻结 → 地图不更新(用户实测)
                                 #    10m 是"保特征"与"滤远噪"的折中
min_laser_range: 0.40            # ⭐ 09-18 由 0.35 提到 0.40: 实测 <0.35m 有车体自射
                                 #    (318°~324° 有 8 个 0.06~0.08m 的固定点)
minimum_time_interval: 0.1
transform_timeout: 0.2
tf_buffer_duration: 30.0
stack_size_to_use: 40000000
enable_interactive_mode: false

# ---- 通用 ----
use_scan_matching: true
use_scan_barycenter: true
# ⭐⭐ 09-18 重要修正: 原值 0.2/0.2 太大 -> 遥控慢速走车时"攒一批才算"→ 累积误差 → 地图整体倾斜!
#     hector 用的是 0.04/0.08 (灵敏 5 倍), 这就是"以前 hector 看着更好"的原因。
#     改成与 hector 同量级, 让 slam_toolbox 跟得上车的移动。
minimum_travel_distance: 0.05
minimum_travel_heading: 0.05
scan_buffer_size: 10
scan_buffer_maximum_scan_distance: 10.0
# ⭐ 09-20 0.1 → 0.15: 匹配响应低于阈值的弱匹配更多被判无效,
#     位姿退回里程计预测, 而不是被空旷区的噪声回波拉走
link_match_minimum_response_fine: 0.15
link_scan_maximum_distance: 1.5
do_loop_closing: true            # ⭐ 回环检测 — hector 没有的能力
loop_search_maximum_distance: 3.5
loop_match_minimum_chain_size: 10
loop_match_maximum_variance_coarse: 3.0
# ⭐ 09-18 放宽回环门槛, 让闭环更容易触发 (原 0.35/0.45 偏严, 走完一圈不咬合)
loop_match_minimum_response_coarse: 0.25
loop_match_minimum_response_fine: 0.35

# ---- 相关性搜索 ----
# ⭐⭐ 09-20 空旷区优化: 0.5 → 0.2。这是扫描匹配围绕"里程计预测位姿"的搜索窗
#     (0.5 = 半径±0.25m)。空旷处特征少, 大窗口里弱响应匹配会把位姿从里程计
#     预测上拽走 → 漂移。收窄 = 更信里程计; 特征丰富时修正仍在窗内完成。
#     若后续实测墙变锯齿(修正被卡住), 再往 0.3 放。
correlation_search_space_dimension: 0.2
correlation_search_space_resolution: 0.01
correlation_search_space_smear_deviation: 0.1

# ---- 回环搜索空间 ----
loop_search_space_dimension: 8.0
loop_search_space_resolution: 0.05
loop_search_space_smear_deviation: 0.03

# ---- 扫描匹配惩罚项 (有里程计, 可以适当收紧) ----
distance_variance_penalty: 0.5
angle_variance_penalty: 1.0
fine_search_angle_offset: 0.00349
# ⭐ 09-20 同理收窄角度搜索窗: ±20° → ±11.5°, 旋转量更听里程计的
coarse_search_angle_offset: 0.2
coarse_angle_resolution: 0.0349
minimum_angle_penalty: 0.9
minimum_distance_penalty: 0.5
use_response_expansion: true
# ⭐⭐ 09-20 过道噪点优化: 2 → 4 / 0.1 → 0.25。这两个值决定一个格子要被
#     多少次观测"确认"才标为占用: 原值下单次噪声回波就能落格 → 灰色噪点、
#     墙有毛边(桌椅腿/远距弱回波时有时无,置信度上不去)。
#     提高后: 噪点要连续 4 次命中且命中率 >25% 才上图 → 地图干净平滑;
#     代价是真实细腿物(椅子腿)也要多扫几帧才显形,慢速推车无影响。
#     实测若噪点仍在: min_pass_through 提到 6; 若椅子腿丢失: 回到 3。
min_pass_through: 4
occupancy_threshold: 0.25
