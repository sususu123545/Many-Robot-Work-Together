chassis_control:
  ros__parameters:
    dry_run: true
    enable_motion: false
    i2c_bus: 1
    i2c_address: 52
    motor_type: 3
    a: 0.110
    b: 0.0975
    wheel_diameter: 0.0965
    pulses_per_rev: 7832.0
    encoder_rate: 20.0
    command_timeout: 0.35
    max_linear: 0.08
    max_angular: 0.20
    max_pulse: 100
mecanum_odom:
  ros__parameters:
    a: 0.110
    b: 0.0975
    wheel_diameter: 0.0965
    pulses_per_rev: 7832.0
    encoder_signs: [1.0, 1.0, 1.0]
