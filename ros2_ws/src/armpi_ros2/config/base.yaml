    serial_port: /dev/rrc
    baudrate: 1000000
    max_step_ticks: 100
    max_temperature: 65
bmi270_imu:
  ros__parameters:
    library_path: /opt/bmi270_py
    rate: 50.0
    frame_id: imu_link
