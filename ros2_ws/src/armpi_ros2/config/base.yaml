    encoder_channel_signs: [1.0, 1.0, 1.0, 1.0]
    imu_topic: /bmi270/imu_raw
    imu_frame: imu_link
    imu_roll: 0.0
    imu_pitch: 0.0
    imu_yaw: 1.57079632679
    imu_yaw_weight: 0.70
    imu_timeout: 0.25
arm_controller:
  ros__parameters:
    dry_run: true
    enable_arm_motion: false
    enable_gripper_motion: false
