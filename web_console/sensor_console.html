<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#e6ecf4;background:#0b0e13;font-synthesis:none;--muted:#8994a5;--line:#252d39;--green:#83e4b1}*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--green);outline-offset:4px}button:hover{background:#28313e}.shell{max-width:1800px;margin:auto;padding:32px 36px 20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:14px}.brandmark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #374438;border-radius:13px;background:#16241d;color:var(--green)}.brandmark svg{width:24px;height:24px}.eyebrow{font-size:10px;letter-spacing:2.2px;color:var(--muted);margin-bottom:6px}h1{font-size:21px;letter-spacing:.5px;margin:0;font-weight:600}.top-actions{display:flex;align-items:center;gap:18px}.status{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:#738093;flex:none}.status[data-state=live]{color:var(--green)}.status[data-state=live] .dot{background:var(--green);box-shadow:0 0 12px #83e4b140}.status[data-state=error]{color:#e6b47e}.status[data-state=error] .dot{background:#e6b47e}.icon-button{width:33px;height:33px;border:1px solid var(--line);border-radius:8px;background:transparent;display:grid;place-items:center}.icon-button svg{width:16px;height:16px}.section-intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section-intro h2{font-size:14px;font-weight:500;margin:0}.section-intro span{font-size:11px;color:#657284;letter-spacing:1px}.views{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}.panel{background:#11161e;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}.panel-head{height:72px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-title{display:flex;align-items:center;gap:11px}.panel-title>svg{width:19px;height:19px;color:#a3b0c2}.panel h3{font-size:14px;margin:0;font-weight:500}.panel-subtitle{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.6px}.panel-tools{display:flex;align-items:center;gap:13px}.stage{position:relative;height:clamp(320px,43vw,580px);background:#090d12;overflow:hidden;border-top:1px solid #1c2530;border-bottom:1px solid #1c2530}.camera-stage{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#18212b 0,#090d12 75%)}#camera{width:100%;height:100%;object-fit:contain;display:block}.camera-stage:not(.has-frame) #camera{visibility:hidden}.stage-label{position:absolute;top:17px;left:17px;border:1px solid #ffffff18;background:#0b1019bb;border-radius:5px;padding:6px 9px;color:#b8c4d3;font:10px ui-monospace,Consolas,monospace;letter-spacing:1px}.live-label{display:flex;align-items:center;gap:6px}.live-label .dot{background:var(--green)}.stage:not(.is-live) .live-label{display:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0a0e14b8;color:#b7c2d1;text-align:center;padding:25px;pointer-events:none}.overlay[hidden]{display:none}.overlay svg{width:32px;height:32px;color:#556376;margin-bottom:5px}.overlay strong{font-size:14px;font-weight:500}.overlay span{font-size:12px;line-height:1.7;color:var(--muted)}.panel-foot{min-height:86px;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;gap:14px}.metrics{display:flex;gap:30px}.metric-label{font-size:10px;color:var(--muted);margin-bottom:7px}.metric-value{font:15px ui-monospace,Consolas,monospace;color:#d6dfeb}.metric-value small{font:10px "Segoe UI",sans-serif;color:var(--muted);margin-left:4px}.foot-note{font-size:10px;color:#667589;white-space:nowrap}#scan{width:100%;height:100%;display:block}.range-control{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:#141b25e8;border:1px solid #303b4a;border-radius:8px;padding:4px}.range-control button{background:transparent;border:0;border-radius:5px;font:11px ui-monospace,Consolas,monospace;padding:6px 13px;color:var(--muted)}.range-control button[aria-pressed=true]{background:#2b3c38;color:#a3edc6}.orientation{position:absolute;right:17px;top:17px;color:#6e8095;font:10px ui-monospace,Consolas,monospace}.bottom{display:flex;justify-content:space-between;gap:14px;margin-top:21px;color:#677487;font-size:11px;line-height:1.6}.bottom time{font:11px ui-monospace,Consolas,monospace;white-space:nowrap}.panel:fullscreen{display:flex;flex-direction:column;border:0;border-radius:0}.panel:fullscreen .stage{height:auto;flex:1}.panel:fullscreen .panel-head,.panel:fullscreen .panel-foot{flex-shrink:0}
@media(min-width:1500px){.shell{padding-top:40px}.stage{height:620px}}@media(max-width:950px){.shell{padding:24px 20px}.views{grid-template-columns:1fr}.stage{height:480px}.topbar{margin-bottom:28px}.section-intro span{display:none}}@media(max-width:520px){.shell{padding:20px 12px}.topbar{gap:10px}.brand{gap:10px}.brandmark{width:36px;height:36px}h1{font-size:17px}.top-actions{gap:10px}.top-actions .status{font-size:11px}.eyebrow{font-size:9px}.panel-head{padding:0 16px}.panel-tools{gap:8px}.panel-tools .status{font-size:11px}.stage{height:340px}.panel-foot{padding:16px;gap:8px}.metrics{gap:18px}.metric-value{font-size:13px}.foot-note{display:none}.bottom{font-size:10px}}
.model-observer{border-top:1px solid var(--line);padding:18px 22px 20px}.model-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.model-heading strong{font-size:12px;font-weight:500}.model-heading small{color:var(--muted);font-size:10px;margin-left:8px}.model-form{display:flex;gap:8px}.model-form input{min-width:0;flex:1;border:1px solid #303b4a;background:#0c1119;border-radius:8px;color:#e6ecf4;padding:10px 11px;font:inherit;font-size:12px;outline:none}.model-form input:focus{border-color:#70bd98}.model-form button{border:1px solid #446d59;border-radius:8px;background:#1e392d;color:#b2efcf;white-space:nowrap;padding:10px 13px;font-size:12px}.model-form button:disabled{opacity:.45;cursor:default}.model-result{display:flex;gap:13px;margin-top:14px;align-items:flex-start}.analysis-preview{position:relative;width:104px;height:78px;flex:none}.analysis-preview[hidden]{display:none}.analysis-preview img{display:block;width:100%;height:100%;object-fit:fill;background:#080c12;border:1px solid var(--line);border-radius:6px}.analysis-preview svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.analysis-preview rect{stroke:#84efb3;stroke-width:2.4;fill:#84efb31a;vector-effect:non-scaling-stroke}.bbox-label{font-size:10px;color:#90e6b4;margin-top:5px}.bbox-label:empty{display:none}.model-result p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.85;color:#c0ccda}.model-meta{color:#75879b;font-size:10px;line-height:1.6;margin-top:8px}.model-meta:empty{display:none}@media(max-width:520px){.model-observer{padding:16px}.model-form{flex-wrap:wrap}.model-form input{flex-basis:100%}.model-form button{width:100%}.model-heading small{display:none}.analysis-preview{width:80px;height:60px}}

<body>
<main class="shell">
<header class="topbar"><div class="brand"><div class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="7" width="14" height="12" rx="4"/><path d="M12 3v4M3 11v4m18-4v4M9 19v2m6-2v2M8 13h2m4 0h2"/><circle cx="12" cy="3" r="1"/></svg></div><div><div class="eyebrow">ARMPI / LIVE VIEW</div><h1>雷达与相机</h1></div></div><div class="top-actions"><span id="overallStatus" class="status" data-state="waiting" role="status"><i class="dot"></i><span>正在连接</span></span><button id="reconnect" class="icon-button" aria-label="重新连接数据" title="重新连接数据"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg></button></div></header>
<div class="section-intro"><h2>实时感知</h2><span>CAMERA + LIDAR</span></div>
<div class="views">
<section class="panel" id="cameraPanel" aria-labelledby="cameraTitle">
<div class="panel-head"><div class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3z"/></svg><div><h3 id="cameraTitle">相机画面</h3><div class="panel-subtitle">机械臂相机</div></div></div><div class="panel-tools"><span id="cameraStatus" class="status" data-state="waiting"><i class="dot"></i><span>等待画面</span></span><button class="icon-button" data-fullscreen="cameraPanel" aria-label="全屏查看相机" title="全屏查看"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></div>
<div class="stage camera-stage" id="cameraStage"><img id="camera" alt="小车相机实时画面"><div class="stage-label live-label"><i class="dot"></i>LIVE</div><div class="overlay" id="cameraOverlay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3z"/></svg><strong id="cameraMessage">正在连接相机</strong><span id="cameraHint">连接后自动显示实时画面</span></div></div>
<div class="panel-foot"><div class="metrics"><div><div class="metric-label">图像尺寸</div><div class="metric-value" id="resolution">—</div></div><div><div class="metric-label">画面刷新</div><div class="metric-value"><span id="cameraRate">—</span><small>Hz</small></div></div></div><span class="foot-note" id="cameraUpdated">等待第一帧</span></div>
<div class="model-observer"><div class="model-heading"><div><strong>模型识别</strong><small>sususu · 本地模型</small></div><span id="modelStatus" class="status" data-state="waiting"><i class="dot"></i><span>正在连接</span></span></div><form id="visionForm" class="model-form"><input id="visionInstruction" aria-label="模型观察问题" maxlength="1000" value="找出红色小球，描述它在画面中的位置。" placeholder="想让模型看什么？"><button id="analyzeFrame" type="submit" disabled>识别当前画面</button></form><div class="model-result" aria-live="polite"><div class="analysis-preview" id="analysisPreview" hidden><img id="analysisFrame" alt="本次模型分析的相机画面"><svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><rect id="analysisBox" x="0" y="0" width="0" height="0" rx="16"/></svg></div><div><p id="visionResult">输入观察问题，识别当前这一帧画面。</p><div id="bboxLabel" class="bbox-label"></div><div class="model-meta" id="visionMeta"></div></div></div></div>
</section>
<section class="panel" id="lidarPanel" aria-labelledby="lidarTitle">
<div class="panel-head"><div class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="m12 12 7-7M12 3v2m9 7h-2M12 21v-2m-9-7h2"/></svg><div><h3 id="lidarTitle">雷达扫描</h3><div class="panel-subtitle">LD06 · 360°</div></div></div><div class="panel-tools"><span id="lidarStatus" class="status" data-state="waiting"><i class="dot"></i><span>等待数据</span></span><button class="icon-button" data-fullscreen="lidarPanel" aria-label="全屏查看雷达" title="全屏查看"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></div>
<div class="stage" id="lidarStage"><canvas id="scan" aria-label="雷达俯视点云，车头朝上"></canvas><div class="stage-label">TOP VIEW</div><div class="orientation">↑ 车头</div><div class="overlay" id="lidarOverlay"><strong id="lidarMessage">正在连接雷达</strong><span>收到数据后自动绘制周围环境</span></div><div class="range-control" aria-label="雷达显示半径"><button data-range="2" aria-pressed="false">2 m</button><button data-range="4" aria-pressed="true">4 m</button><button data-range="8" aria-pressed="false">8 m</button></div></div>
<div class="panel-foot"><div class="metrics"><div><div class="metric-label">有效测距点</div><div class="metric-value"><span id="pointCount">—</span><small>点</small></div></div><div><div class="metric-label">接收频率</div><div class="metric-value"><span id="scanRate">—</span><small>Hz</small></div></div><div><div class="metric-label">最近测距</div><div class="metric-value"><span id="nearest">—</span><small>m</small></div></div></div></div>
</section>
</div>
<footer class="bottom"><span id="connectionNote">自动连接小车，等待传感器数据</span><time id="clock"></time></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const STALE_MS=3000;
const state={ws:null,retry:null,retryDelay:1000,host:'',scan:null,scanAt:0,cameraAt:0,scanTimes:[],cameraTimes:[],radius:4,cameraGeneration:0,cameraAbort:null,cameraTimer:null,imageUrl:null,latestFrame:null,frameCapturedAt:0,modelAvailable:false,analysisBusy:false,analysisUrl:null,disposed:false};
function setStatus(id,kind,text){const el=$(id);el.dataset.state=kind;el.querySelector('span').textContent=text;}
function rate(times,now){const recent=times.filter(t=>now-t<3000);return recent.length>1?((recent.length-1)*1000/(recent[recent.length-1]-recent[0])).toFixed(1):'—';}
function markTime(list,now){list.push(now);while(list.length&&now-list[0]>4000)list.shift();}
function validRange(r,scan){return Number.isFinite(r)&&r>0&&r>=scan.range_min&&r<=scan.range_max;}
function acceptScan(scan){
  if(!scan||!Array.isArray(scan.ranges)||!Number.isFinite(scan.angle_min)||!Number.isFinite(scan.angle_increment)||!Number.isFinite(scan.range_min)||!Number.isFinite(scan.range_max)||scan.range_max<=scan.range_min)return;
  state.scan=scan;state.scanAt=performance.now();markTime(state.scanTimes,state.scanAt);
  const valid=scan.ranges.filter(r=>validRange(r,scan));
  $('pointCount').textContent=String(valid.length);$('nearest').textContent=valid.length?valid.reduce((a,b)=>Math.min(a,b),Infinity).toFixed(2):'—';
  drawScan();updateStatus();
}
function drawScan(){
  const canvas=$('scan'),rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  const width=Math.max(1,rect.width),height=Math.max(1,rect.height);
  if(canvas.width!==Math.round(width*dpr)||canvas.height!==Math.round(height*dpr)){canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);}
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
  const x=width/2,y=height/2,radius=Math.max(40,Math.min(width,height)/2-55),scale=radius/state.radius;
  ctx.strokeStyle='#202d3b';ctx.lineWidth=1;ctx.font='10px ui-monospace,Consolas,monospace';ctx.fillStyle='#687c90';
  for(let i=1;i<=4;i++){const r=radius*i/4;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.fillText((state.radius*i/4)+' m',x+6,y-r+14);}
  ctx.setLineDash([3,6]);ctx.beginPath();ctx.moveTo(x-radius,y);ctx.lineTo(x+radius,y);ctx.moveTo(x,y-radius);ctx.lineTo(x,y+radius);ctx.stroke();ctx.setLineDash([]);
  if(state.scan&&performance.now()-state.scanAt<STALE_MS){ctx.fillStyle='#9aebbe';state.scan.ranges.forEach((r,i)=>{if(!validRange(r,state.scan)||r>state.radius)return;const a=state.scan.angle_min+i*state.scan.angle_increment;ctx.beginPath();ctx.arc(x-Math.sin(a)*r*scale,y-Math.cos(a)*r*scale,1.55,0,Math.PI*2);ctx.fill();});}
  ctx.fillStyle='#83e4b114';ctx.beginPath();ctx.arc(x,y,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d3e9df';ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x+6,y+6);ctx.lineTo(x,y+3);ctx.lineTo(x-6,y+6);ctx.closePath();ctx.fill();
}
function connectRadar(){
  if(state.disposed)return;clearTimeout(state.retry);
  if(state.ws){state.ws.onclose=null;state.ws.close();}
  const ws=new WebSocket('ws://127.0.0.1:9090');state.ws=ws;
  ws.onopen=()=>{if(state.ws!==ws)return;state.retryDelay=1000;ws.send(JSON.stringify({op:'subscribe',id:'sensor-view-scan',topic:'/scan',type:'sensor_msgs/msg/LaserScan',throttle_rate:100,queue_length:1}));updateStatus();};
  ws.onmessage=event=>{if(state.ws!==ws)return;try{const m=JSON.parse(event.data);if(m.op==='publish'&&m.topic==='/scan')acceptScan(m.msg);}catch{/* Ignore malformed telemetry. */}};
  ws.onerror=()=>ws.close();
  ws.onclose=()=>{if(state.ws!==ws||state.disposed)return;state.scanAt=0;state.scan=null;state.scanTimes=[];drawScan();updateStatus();state.retry=setTimeout(connectRadar,state.retryDelay);state.retryDelay=Math.min(10000,state.retryDelay*1.5);};
}
function resetCamera(){
  state.cameraGeneration++;state.cameraAt=0;state.cameraTimes=[];state.latestFrame=null;state.frameCapturedAt=0;clearTimeout(state.cameraTimer);if(state.cameraAbort)state.cameraAbort.abort();
  if(state.imageUrl){URL.revokeObjectURL(state.imageUrl);state.imageUrl=null;}
  $('camera').removeAttribute('src');$('cameraStage').classList.remove('has-frame');$('resolution').textContent='—';
  updateStatus();if(state.host&&!state.disposed)pollCamera(state.cameraGeneration);
}
async function pollCamera(generation){
  if(state.disposed||generation!==state.cameraGeneration||!state.host)return;
  if(document.hidden){state.cameraTimer=setTimeout(()=>pollCamera(generation),1000);return;}
  const controller=new AbortController();state.cameraAbort=controller;let timeout=setTimeout(()=>controller.abort(),6000),nextUrl=null,reader=null;
  try{
    const query=new URLSearchParams({ip:state.host,topic:'/rear_camera/image_raw',t:String(Date.now())});
    const response=await fetch('/stream?'+query,{signal:controller.signal,cache:'no-store'});
    if(!response.ok)throw new Error('camera unavailable');
    if(!response.body||!response.headers.get('Content-Type')?.includes('multipart/'))throw new Error('invalid video stream');
    reader=response.body.getReader();let pending=new Uint8Array(0);
    while(generation===state.cameraGeneration&&!state.disposed){
      const part=await reader.read();if(part.done)throw new Error('video stream ended');
      const merged=new Uint8Array(pending.length+part.value.length);merged.set(pending);merged.set(part.value,pending.length);pending=merged;
      let latest=null,parsed;
      while((parsed=extractJpeg(pending))!==null){latest=parsed.frame;pending=parsed.rest;}
      if(pending.length>4*1024*1024)throw new Error('oversized video frame');
      if(!latest)continue;
      nextUrl=URL.createObjectURL(new Blob([latest],{type:'image/jpeg'}));const frame=new Image();frame.src=nextUrl;await frame.decode();
      if(generation!==state.cameraGeneration||state.disposed){URL.revokeObjectURL(nextUrl);nextUrl=null;break;}
      const oldUrl=state.imageUrl;state.imageUrl=nextUrl;nextUrl=null;$('camera').src=state.imageUrl;if(oldUrl)URL.revokeObjectURL(oldUrl);
      state.cameraAt=performance.now();state.latestFrame=latest;state.frameCapturedAt=Date.now()/1000;markTime(state.cameraTimes,state.cameraAt);$('resolution').textContent=frame.naturalWidth+' × '+frame.naturalHeight;
      $('cameraStage').classList.add('has-frame');clearTimeout(timeout);timeout=setTimeout(()=>controller.abort(),6000);updateStatus();
    }
  }catch(error){if(nextUrl)URL.revokeObjectURL(nextUrl);if(generation===state.cameraGeneration)updateStatus();}
  finally{clearTimeout(timeout);controller.abort();if(reader)reader.cancel().catch(()=>{});if(generation===state.cameraGeneration&&!state.disposed)state.cameraTimer=setTimeout(()=>pollCamera(generation),1500);}
}
// MJPEG is a sequence of complete JPEG images; markers can span network chunks.
function extractJpeg(bytes){
  let start=-1;
  for(let i=0;i<bytes.length-1;i++){
    if(start<0&&bytes[i]===255&&bytes[i+1]===216){start=i;i++;continue;}
    if(start>=0&&bytes[i]===255&&bytes[i+1]===217)return {frame:bytes.slice(start,i+2),rest:bytes.slice(i+2)};
  }
  return null;
}
async function discoverRobot(){
  try{
    const response=await fetch('/api/robot',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!response.ok)return;
    const data=await response.json();
    const host=typeof data.ip==='string'&&/^(\d{1,3}\.){3}\d{1,3}$/.test(data.ip)&&data.ip.split('.').every(v=>Number(v)<=255)?data.ip:'';
    if(host!==state.host){state.host=host;resetCamera();}
  }catch{/* Keep the last discovered address during transient proxy failures. */}
}
function updateStatus(){
  const now=performance.now(),cameraLive=state.cameraAt>0&&now-state.cameraAt<STALE_MS,scanLive=state.scanAt>0&&now-state.scanAt<STALE_MS;
  $('analyzeFrame').disabled=!cameraLive||!state.modelAvailable||state.analysisBusy;
  setStatus('cameraStatus',cameraLive?'live':'waiting',cameraLive?'画面在线':state.cameraAt?'画面中断':'等待画面');setStatus('lidarStatus',scanLive?'live':'waiting',scanLive?'数据在线':'等待数据');
  $('cameraStage').classList.toggle('is-live',cameraLive);$('cameraOverlay').hidden=cameraLive;$('lidarOverlay').hidden=scanLive;
  $('cameraMessage').textContent=state.cameraAt?'相机画面暂时中断':state.host?'正在获取相机画面':'正在寻找小车';
  $('cameraHint').textContent=state.host?'连接恢复后自动显示画面':'请确认小车在线，本页会自动重试';
  $('lidarMessage').textContent=state.ws&&state.ws.readyState===WebSocket.OPEN?'等待雷达扫描数据':'正在连接雷达';
  $('cameraRate').textContent=cameraLive?rate(state.cameraTimes,now):'—';$('scanRate').textContent=scanLive?rate(state.scanTimes,now):'—';
  if(!scanLive){$('pointCount').textContent='—';$('nearest').textContent='—';drawScan();}
  $('cameraUpdated').textContent=cameraLive?'刚刚更新':state.cameraAt?'上次画面 '+Math.floor((now-state.cameraAt)/1000)+' 秒前':'等待第一帧';
  const allLive=cameraLive&&scanLive;setStatus('overallStatus',allLive?'live':cameraLive||scanLive?'error':'waiting',allLive?'传感器在线':cameraLive||scanLive?'部分数据在线':'等待小车数据');
  $('connectionNote').textContent=state.host?'小车 '+state.host+' · '+(allLive?'相机与雷达正在更新':'正在等待传感器，连接将自动重试'):'自动连接小车，等待传感器数据';
  $('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});
}
async function modelInfo(){
  try{
    const response=await fetch('/api/model',{cache:'no-store',signal:AbortSignal.timeout(10000)});
    const data=await response.json();state.modelAvailable=response.ok&&data.available===true;
    setStatus('modelStatus',state.modelAvailable?'live':'error',state.modelAvailable?'模型在线':'模型未连接');
    $('modelStatus').title=data.message||'';
  }catch{state.modelAvailable=false;setStatus('modelStatus','error','模型未连接');}
  updateStatus();
}
async function analyzeFrame(event){
  event.preventDefault();
  if(state.analysisBusy||!state.modelAvailable||!state.latestFrame||performance.now()-state.cameraAt>=STALE_MS)return;
  const instruction=$('visionInstruction').value.trim();if(!instruction)return;
  const frame=state.latestFrame.slice(),capturedAt=state.frameCapturedAt;
  state.analysisBusy=true;$('analyzeFrame').textContent='正在识别…';$('visionResult').textContent='模型正在观察这一帧画面…';$('bboxLabel').textContent='';
  $('visionMeta').textContent='画面时间 '+new Date(capturedAt*1000).toLocaleTimeString('zh-CN',{hour12:false});
  if(state.analysisUrl)URL.revokeObjectURL(state.analysisUrl);
  state.analysisUrl=URL.createObjectURL(new Blob([frame],{type:'image/jpeg'}));$('analysisFrame').src=state.analysisUrl;$('analysisPreview').hidden=false;$('analysisBox').setAttribute('width','0');
  updateStatus();const started=performance.now();
  try{
    let binary='';for(let i=0;i<frame.length;i+=16384)binary+=String.fromCharCode(...frame.subarray(i,i+16384));
    const response=await fetch('/api/vision/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction,captured_at:capturedAt,image_base64:btoa(binary)}),signal:AbortSignal.timeout(15000)});
    const submission=await response.json();if(!response.ok)throw new Error(submission.message||'无法提交识别请求');
    let job;
    while(!state.disposed){
      const status=await fetch('/api/vision/jobs/'+encodeURIComponent(submission.job_id),{cache:'no-store',signal:AbortSignal.timeout(10000)});
      job=await status.json();if(!status.ok)throw new Error(job.message||'无法读取识别结果');
      if(job.status==='failed')throw new Error(job.error||'模型识别失败');
      if(job.status==='succeeded')break;
      if(performance.now()-started>105000)throw new Error('等待结果超时，请稍后重试');
      $('visionMeta').textContent='画面时间 '+new Date(capturedAt*1000).toLocaleTimeString('zh-CN',{hour12:false})+' · 已等待 '+Math.floor((performance.now()-started)/1000)+' 秒';
      await new Promise(resolve=>setTimeout(resolve,700));
    }
    if(state.disposed)return;
    $('visionResult').textContent=job.result.text;
    if(job.result.found===true&&Array.isArray(job.result.bbox)){
      const [left,top,right,bottom]=job.result.bbox;
      $('analysisBox').setAttribute('x',String(left*1000));$('analysisBox').setAttribute('y',String(top*1000));
      $('analysisBox').setAttribute('width',String((right-left)*1000));$('analysisBox').setAttribute('height',String((bottom-top)*1000));
      $('bboxLabel').textContent=job.result.label+' · 模型自评分 '+Math.round(job.result.confidence*100)+'%';
    }else if(job.result.found===false){$('bboxLabel').textContent='未定位到目标';}
    else{$('bboxLabel').textContent='回答中未包含有效定位框';}
    $('visionMeta').textContent='画面时间 '+new Date(capturedAt*1000).toLocaleTimeString('zh-CN',{hour12:false})+' · 耗时 '+job.result.elapsed_seconds+' 秒'+(job.result.truncated?' · 回答达到长度上限':'');
  }catch(error){$('visionResult').textContent=error.name==='TimeoutError'?'模型连接超时，请稍后重试。':error.message;}
  finally{state.analysisBusy=false;$('analyzeFrame').textContent='识别当前画面';updateStatus();}
}
$('visionForm').addEventListener('submit',analyzeFrame);
document.querySelectorAll('[data-range]').forEach(button=>button.addEventListener('click',()=>{state.radius=Number(button.dataset.range);document.querySelectorAll('[data-range]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));drawScan();}));
document.querySelectorAll('[data-fullscreen]').forEach(button=>button.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $(button.dataset.fullscreen).requestFullscreen();}catch{/* Fullscreen can be unavailable in embedded browsers. */}}));
$('reconnect').addEventListener('click',()=>{state.scan=null;state.scanAt=0;state.scanTimes=[];connectRadar();resetCamera();discoverRobot();});
window.addEventListener('resize',drawScan);document.addEventListener('fullscreenchange',drawScan);document.addEventListener('visibilitychange',()=>{if(!document.hidden){updateStatus();discoverRobot();}});
window.addEventListener('beforeunload',()=>{state.disposed=true;clearTimeout(state.retry);clearTimeout(state.cameraTimer);if(state.cameraAbort)state.cameraAbort.abort();if(state.ws)state.ws.close();if(state.imageUrl)URL.revokeObjectURL(state.imageUrl);if(state.analysisUrl)URL.revokeObjectURL(state.analysisUrl);});
new ResizeObserver(drawScan).observe($('scan'));setInterval(updateStatus,500);setInterval(discoverRobot,5000);setInterval(modelInfo,30000);drawScan();updateStatus();connectRadar();discoverRobot();modelInfo();
</script>
