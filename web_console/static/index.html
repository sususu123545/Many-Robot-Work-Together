<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多车协作 · 送水控制台</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --line: #e3e6ea;
    --text: #1f2430; --muted: #7a828e;
    --accent: #2563eb; --accent-soft: #eaf0fe;
    --ok: #16a34a; --warn: #d97706; --err: #dc2626; --run: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
  }
  header { width: 100%; max-width: 920px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 20px; font-weight: 700; }
  .conn { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--err); color: #fff; }
  .conn.on { background: var(--ok); }
  .layout { width: 100%; max-width: 920px; display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 12px; letter-spacing: .05em; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .btn {
    padding: 10px 18px; border: none; border-radius: 8px; background: var(--accent);
    color: #fff; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--accent-soft); color: var(--accent); font-size: 13px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  #taskList { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; }
  .task { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .task .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .task .cmd { font-size: 14px; font-weight: 600; }
  .task .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .b-queued     { background: #f1f5f9; color: #64748b; }
  .b-active     { background: var(--accent-soft); color: var(--accent); }
  .b-done       { background: #ecfdf5; color: var(--ok); }
  .b-failed     { background: #fef2f2; color: var(--err); }
  .b-cancelled  { background: #f1f5f9; color: var(--muted); }
  .cancel-btn {
    font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--err); cursor: pointer;
  }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }
  /* 机器人状态卡 */
  .robot-name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
  .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); }
  .battery { display: flex; align-items: center; gap: 8px; }
  .bar { width: 90px; height: 8px; background: #eef0f3; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
  .note { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  footer { margin-top: 18px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>🚚 多车协作 · 送水控制台</h1>
  <span class="conn" id="conn">连接中…</span>
</header>

<div class="layout">
  <!-- 左列：下单 + 任务列表 -->
  <div class="card">
    <h2>下达指令</h2>
    <div class="input-row">
      <input id="cmdInput" type="text" placeholder="例如：给我拿水 ／ 帮 3 号座位拿杯水" autocomplete="off">
      <button class="btn" id="sendBtn">发送</button>
    </div>
    <div class="quick" id="quickBtns"></div>

    <h2 style="margin-top:22px">任务列表</h2>
    <div id="taskList"><div class="empty">还没有任务，试着在上方输入一句话。</div></div>
  </div>

  <!-- 右列：机器人状态 -->
  <div class="card">
    <h2>机器人状态</h2>
    <div class="robot-name"><span class="dot" id="robotDot"></span><span id="robotName">—</span></div>
    <div style="margin-top:10px">
      <div class="kv"><span class="k">电量</span>
        <span class="battery"><span class="bar"><i id="battBar" style="width:0%"></i></span><span id="battNum">—</span></span>
      </div>
      <div class="kv"><span class="k">当前位置</span><span id="robotPos">—</span></div>
      <div class="kv"><span class="k">当前任务</span><span id="robotTask">空闲</span></div>
      <div class="kv"><span class="k">运行模式</span><span id="robotMode">—</span></div>
    </div>
    <div class="note">
      当前为<b>模拟模式</b>：机器人按真实节奏虚拟执行，用于验收下单 → 取水 → 配送 全流程交互。<br>
      阶段 1 部署后，这里将切换为树莓派真车的实时状态。
    </div>
  </div>
</div>

<footer>阶段 1 · 网页控制台 — 下单即执行，右上角绿点表示与后端连接正常</footer>

<script>
const API = location.origin;
const STATUS_CN = {
  queued: "排队中", moving_to_pick: "前往取水点", grasping: "抓取中",
  moving_to_seat: "配送中", placing: "放置物品", done: "已完成",
  failed: "失败", cancelled: "已取消",
};
const ACTIVE = new Set(["moving_to_pick", "grasping", "moving_to_seat", "placing"]);
let SEATS = {};

// ---------- 快捷按钮 ----------
function renderQuick() {
  const box = document.getElementById("quickBtns");
  const items = ["给我拿水"];
  for (const key of Object.keys(SEATS)) {
    if (key !== "user") items.push("给 " + SEATS[key] + " 送水");
  }
  box.innerHTML = "";
  items.forEach(text => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = text;
    b.onclick = () => sendCommand(text);
    box.appendChild(b);
  });
}

// ---------- 下单 ----------
async function sendCommand(text) {
  const input = document.getElementById("cmdInput");
  const cmd = (text || input.value).trim();
  if (!cmd) return;
  input.value = "";
  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  try {
    const r = await fetch(API + "/api/task", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command: cmd }),
    });
    const data = await r.json();
    if (!data.ok) alert("下单失败：" + data.error);
  } catch (e) {
    alert("后端连接失败：" + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function cancelTask(id) {
  try { await fetch(API + "/api/cancel/" + id, { method: "POST" }); } catch (e) {}
}

// ---------- 渲染 ----------
function render(snap) {
  // 机器人卡
  const r = snap.robot || {};
  document.getElementById("robotName").textContent = r.name || "—";
  document.getElementById("battNum").textContent = (r.battery ?? "—") + "%";
  const bar = document.getElementById("battBar");
  bar.style.width = (r.battery || 0) + "%";
  bar.style.background = (r.battery ?? 100) < 20 ? "var(--err)" : "var(--ok)";
  document.getElementById("robotPos").textContent = r.position || "—";
  document.getElementById("robotMode").textContent = r.mode === "simulator" ? "模拟执行" : "真车";
  const tid = r.current_task;
  document.getElementById("robotTask").textContent = tid
    ? ("#" + tid.slice(0, 4) + " 执行中") : "空闲";
  document.getElementById("robotDot").style.background =
    tid ? "var(--run)" : "var(--ok)";

  // 任务列表
  const list = document.getElementById("taskList");
  if (!snap.tasks || snap.tasks.length === 0) {
    list.innerHTML = '<div class="empty">还没有任务，试着在上方输入一句话。</div>';
    return;
  }
  list.innerHTML = "";
  snap.tasks.forEach(t => {
    const active = ACTIVE.has(t.status);
    const badgeCls = t.status === "done" ? "b-done"
      : t.status === "failed" ? "b-failed"
      : t.status === "cancelled" ? "b-cancelled"
      : active ? "b-active" : "b-queued";
    const div = document.createElement("div");
    div.className = "task";
    div.innerHTML =
      '<div class="top">' +
        '<span class="cmd">' + escapeHtml(t.command) + '</span>' +
        '<span class="badge ' + badgeCls + '">' + (STATUS_CN[t.status] || t.status) + '</span>' +
      '</div>' +
      '<div class="meta">物品：' + escapeHtml(t.object_label || "") +
        ' · 送达：' + escapeHtml(t.target_label || "") +
        ' · 下单 ' + escapeHtml(t.created || "") +
        (t.note ? ' · ' + escapeHtml(t.note) : '') + '</div>';
    if (t.status === "queued" || active) {
      const cb = document.createElement("button");
      cb.className = "cancel-btn"; cb.textContent = "取消";
      cb.style.marginTop = "8px";
      cb.onclick = () => cancelTask(t.id);
      div.appendChild(cb);
    }
    list.appendChild(div);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- WebSocket（断线自动重连） ----------
let ws, retryMs = 1500;
function connect() {
  ws = new WebSocket(API.replace("http", "ws") + "/ws/status");
  ws.onopen = () => {
    retryMs = 1500;
    const c = document.getElementById("conn");
    c.textContent = "已连接"; c.classList.add("on");
  };
  ws.onmessage = ev => { try { render(JSON.parse(ev.data)); } catch (e) {} };
  ws.onclose = () => {
    const c = document.getElementById("conn");
    c.textContent = "连接断开，重试中…"; c.classList.remove("on");
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 10000);
  };
  ws.onerror = () => ws.close();
}

// ---------- 初始化 ----------
(async function init() {
  try {
    const r = await fetch(API + "/api/config");
    const cfg = await r.json();
    SEATS = cfg.seats || {};
  } catch (e) { SEATS = { seat1: "1 号座位", seat2: "2 号座位", seat3: "3 号座位" }; }
  renderQuick();
  connect();
})();

document.getElementById("sendBtn").onclick = () => sendCommand();
document.getElementById("cmdInput").addEventListener("keydown", e => {
  if (e.key === "Enter") sendCommand();
});
</script>
</body>
</html>
